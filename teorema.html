<body>

        <p class="marca"><a href="index.html" id="a-inici">Teoremes que no t’esperes</a></p>
        <nav class="navega" aria-label="Teoremes">
            <a href="index.html" id="a-anterior"></a>
            <a href="index.html" id="a-tots"></a>
            <a href="index.html" id="a-seguent"></a>
        </nav>
    </header>

    <main class="principal" id="principal">
        <section class="cap-teorema" aria-labelledby="nom">
            <p class="etiqueta" id="etiqueta"></p>
            <h1 id="nom"></h1>
            <p class="angles" id="angles" lang="en"></p>
            <p class="enunciat" id="enunciat"></p>
        </section>

        <div class="columnes">
            <section class="col-figura" aria-label="La figura">
                <div class="avis-trencada" id="avis-trencada" hidden>
                    <p><strong id="t-en-trencada"></strong> <span id="text-trencada"></span></p>
                </div>
                <div class="marc-figura" id="figura"></div>
                <div class="mesura" id="mesura">
                    <div class="barra" aria-hidden="true"><div class="ple-barra" id="ple-barra"></div></div>
                    <p class="valor" id="valor-error" aria-live="polite"></p>
                </div>
                <p class="nota" id="instruccio"></p>
                <p class="nota" id="nota"></p>
                <div class="accions">
                    <button type="button" class="btn btn-principal" id="btn-prova"></button>
                    <button type="button" class="btn" id="btn-atzar"></button>
                    <button type="button" class="btn" id="btn-inicial"></button>
                    <button type="button" class="btn" id="btn-trencada" aria-pressed="false"></button>
                </div>
                <div class="informe" id="informe" aria-live="polite" hidden></div>
                <p class="nota" id="nota-error"></p>
            </section>

            <section class="col-text">
                <details class="historia">
                    <summary id="t-historia"></summary>
                    <p id="historia"></p>
                </details>

                <section class="panell" aria-labelledby="t-pistes">
                    <h2 id="t-pistes"></h2>
                    <p class="nota" id="pistes-nota"></p>
                    <ol class="pistes" id="pistes" aria-live="polite"></ol>
                    <div class="accions">
                        <button type="button" class="btn" id="btn-pista"></button>
                    </div>
                </section>

                <section class="panell" aria-labelledby="t-demo">
                    <h2 id="t-demo"></h2>
                    <ol class="passos" id="passos"></ol>
                    <div class="prova-primer" id="prova-primer" hidden>
                        <p><strong id="t-prova-primer"></strong> <span id="text-prova-primer"></span></p>
                        <button type="button" class="btn btn-petit" id="btn-pensat"></button>
                    </div>
                    <div class="accions">
                        <button type="button" class="btn btn-principal" id="btn-pas"></button>
                        <span class="nota" id="pas-de"></span>
                    </div>
                </section>

                <section class="panell" aria-labelledby="t-idespres">
                    <h2 id="t-idespres"></h2>
                    <div id="idespres" hidden>
                        <p id="text-idespres"></p>
                        <p class="nota" id="idespres-figura"></p>
                    </div>
                    <div class="accions">
                        <button type="button" class="btn" id="btn-idespres" aria-expanded="false"></button>
                    </div>
                </section>

                <section class="referencies" aria-labelledby="t-referencies">
                    <h2 id="t-referencies"></h2>
                    <ul id="referencies"></ul>
                </section>

                <p class="enllacos">
                    <a href="fitxa.html" id="a-fitxa"></a>
                    <button type="button" class="btn btn-petit" id="btn-projector" aria-pressed="false"></button>
                </p>
            </section>
        </div>
    </main>
